# Configuración de Netlify para bycarlo.es
# La web es estática (carpeta public) y el chat es una función en netlify/functions.

[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

# Cabeceras de seguridad para las páginas (las funciones ponen las suyas en el código).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
